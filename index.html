<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? Dhana 💕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(45deg, #ff6b9d, #c44569, #f8b500, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Heart Background */
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Main Container */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            color: white;
            text-shadow: 0 0 20px #ff69b4;
            margin-bottom: 1.5em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 2em;
            justify-content: center;
        }

        button {
            padding: 1em 2em;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #yes {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
        }

        #yes:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255,105,180,0.6);
        }

        #no {
            background: linear-gradient(45deg, #ffcccb, #ffb6c1);
            color: #333;
            position: relative;
        }

        /* Celebration Screen */
        .celebration {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 40px 20px;
            z-index: 10;
            animation: celebrate 1s ease-out;
        }

        @keyframes celebrate {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .message {
            font-size: 2.5em;
            color: #ff1493;
            text-shadow: 0 0 20px #fff;
            margin-bottom: 0.5em;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        /* Media Layout */
        .media-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .cat-gif {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 250px;
            height: auto;
        }

        .cute-img {
            width: 220px;
            height: 220px;
            object-fit: cover; /* Keeps faces in proportion */
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(255,105,180,0.5); }
            to { box-shadow: 0 0 40px rgba(255,20,147,0.8); }
        }

        /* UI Elements */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            color: #ff69b4;
            border: 2px solid #ff69b4;
            padding: 0.5em 1em;
            border-radius: 50px;
            font-size: 0.9em;
            cursor: pointer;
            z-index: 100;
            display: none;
        }

        .audio-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .message { font-size: 1.8em; }
            .cute-img { width: 180px; height: 180px; }
            .cat-gif { width: 200px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="yours.mp3" type="audio/mpeg">
        <source src="https://www.soundjay.com/misc/sounds/cat-1.mp3" type="audio/mpeg">
    </audio>
    
    <div class="audio-controls">
        <button id="muteBtn" style="background: rgba(255,255,255,0.9); border: none; padding: 0.5em 1em; border-radius: 20px; cursor: pointer;">
            🔊
        </button>
    </div>

    <div class="hearts" id="hearts"></div>
    <button class="back-btn" id="backBtn">← Back Cutie 🥰</button>
    
    <div class="container" id="question">
        <h1>Will you be my Valentine, Dhana? 💖</h1>
        <div class="buttons">
            <button id="yes">Yes 💕</button>
            <button id="no">No 😏</button>
        </div>
    </div>
        
    <div class="celebration" id="celebration">
        <h1 class="message">Yay! I knew you'd say YES! ❤️</h1>
        <p style="font-size: 1.2em; color: white; text-align: center; max-width: 80%; margin-bottom: 10px;">
            You're the best thing that's ever happened to me. Let's make this Valentine's magical! 🌹
        </p>
        <p style="color: #fff; font-weight: bold; margin-bottom: 20px;">LOVEE U Siki Baby</p>
        
        <div class="media-group">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMTMwNm1vMDIzYmxrMjRjb2hqM3MwOTJ4M2ZlanltbTh1bG9idDZtYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" 
                 alt="Cute cat" class="cat-gif">
            
            <img src="./us.jpeg" alt="Us" class="cute-img">
        </div>

        <div id="confetti" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const muteBtn = document.getElementById('muteBtn');
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const backBtn = document.getElementById('backBtn');
        const questionDiv = document.getElementById('question');
        const celebrationDiv = document.getElementById('celebration');

        // Music Logic
        document.addEventListener('click', () => {
            bgMusic.play().catch(() => {});
        }, { once: true });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerHTML = bgMusic.muted ? '🔇' : '🔊';
        });

        // Floating Hearts Background
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['❤️','💖','💕','💗','💝'][Math.floor(Math.random()*5)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random()*3 + 3) + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 400);

        // Runaway No Button
        noBtn.addEventListener('mouseenter', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Yes Button Click
        yesBtn.addEventListener('click', () => {
            questionDiv.style.display = 'none';
            celebrationDiv.style.display = 'flex';
            backBtn.style.display = 'block';
            startConfetti();
        });

        // Back Button Click
        backBtn.addEventListener('click', () => {
            celebrationDiv.style.display = 'none';
            questionDiv.style.display = 'block';
            backBtn.style.display = 'none';
            document.getElementById('confetti').innerHTML = '';
        });

        function startConfetti() {
            const confettiContainer = document.getElementById('confetti');
            for (let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '100%';
                conf.innerHTML = ['❤️','✨','💖','🌸'][Math.floor(Math.random()*4)];
                conf.style.fontSize = Math.random() * 20 + 20 + 'px';
                conf.style.animation = `float ${Math.random()*2 + 2}s linear forwards`;
                confettiContainer.appendChild(conf);
            }
        }
    </script>
</body>
</html>
